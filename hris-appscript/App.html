/* ------------------------------------------------------------------ server calls */

function api(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      var m = (e && e.message) || String(e);
      if (/^(Error: )?SESSION:/.test(m)) { endSession(m.replace(/^(Error: )?SESSION:\s*/, '')); }
      reject(new Error(m.replace(/^Error:\s*/, '').replace(/^SESSION:\s*/, '')));
    }).api(S.token, action, payload || {});
  });
}
function call(fn, a, b) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(String((e && e.message) || e).replace(/^Error:\s*/, ''))); })[fn](a, b);
  });
}

/* ------------------------------------------------------------------ boot, login, logout */

function boot() {
  document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', { timeZone: 'Asia/Manila', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  try { S.token = sessionStorage.getItem('hris_token') || ''; } catch (e) { S.token = ''; }
  document.getElementById('loginForm').addEventListener('submit', doLogin);
  document.getElementById('menuBtn').onclick = function () { document.getElementById('side').classList.toggle('open'); };
  document.getElementById('bell').onclick = toggleNotif;
  document.querySelector('[data-act=logout]').onclick = doLogout;
  document.querySelector('[data-act=password]').onclick = function () { passwordDialog(false); };
  if (!S.token) return showLogin();
  api('me').then(start).catch(function () { showLogin(); });
}

function showLogin(msg) {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  var err = document.getElementById('loginErr');
  err.textContent = msg || ''; err.classList.toggle('hidden', !msg);
  setTimeout(function () { document.getElementById('lu').focus(); }, 50);
}

function doLogin(ev) {
  ev.preventDefault();
  var btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Logging in…'; err.classList.add('hidden');
  call('login', document.getElementById('lu').value, document.getElementById('lp').value).then(function (r) {
    S.token = r.token;
    try { sessionStorage.setItem('hris_token', r.token); } catch (e) { /* private mode */ }
    document.getElementById('lp').value = '';
    start(r.me);
  }).catch(function (e) { err.textContent = e.message; err.classList.remove('hidden'); })
    .then(function () { btn.disabled = false; btn.textContent = 'Log in'; });
}

function doLogout() {
  call('logout', S.token).catch(function () {});
  endSession('');
}

function endSession(msg) {
  S.token = ''; S.me = null; S.lookups = null;
  try { sessionStorage.removeItem('hris_token'); } catch (e) { /* ignore */ }
  closeModal();
  showLogin(msg);
}

function start(me) {
  S.me = me;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('brandTitle').innerHTML = h(me.title) + '<small>Human Resources Information System</small>';
  document.getElementById('footCo').textContent = me.company;
  document.title = me.title;
  document.getElementById('acctRole').textContent = me.roleLabel;
  document.getElementById('acctScope').textContent = me.role === 'BRANCH_MANAGER' ? me.branches.join(', ') :
    me.employee ? me.employee.Position + ' · ' + me.employee.Branch : 'All HQs and branches';
  document.getElementById('pname').textContent = me.name;
  document.getElementById('avatar').textContent = initials(me.name);
  buildNav();
  if (me.mustChange) { passwordDialog(true); return; }
  nav('dashboard');
  refreshNotifs();
}

function hasEmp() { return !!(S.me && S.me.employeeId); }
function role() { return S.me ? S.me.role : ''; }
function isHR() { return HR.indexOf(role()) >= 0; }
function isMgr() { return role() === 'BRANCH_MANAGER'; }

function buildNav() {
  var r = role(), html = '', grp = '';
  NAV.forEach(function (n) {
    if (n.roles.indexOf(r) < 0 || (n.needEmp && !hasEmp())) return;
    if (n.group !== grp) { grp = n.group; html += '<div class="grp">' + grp + '</div>'; }
    html += '<a data-nav="' + n.id + '">' + ico(n.icon) + '<span>' + h((n.labels && n.labels[r]) || n.label) + '</span>' +
      (n.badge ? '<i class="badge hidden" data-badge="' + n.badge + '"></i>' : '') + '</a>';
  });
  var el = document.getElementById('nav');
  el.innerHTML = html;
  el.querySelectorAll('[data-nav]').forEach(function (a) { a.onclick = function () { nav(a.getAttribute('data-nav')); }; });
}

function navLabel(id) {
  var n = NAV.filter(function (x) { return x.id === id; })[0];
  return n ? ((n.labels && n.labels[role()]) || n.label) : '';
}

function nav(id, arg) {
  S.page = id; S.arg = arg === undefined ? null : arg;
  document.getElementById('side').classList.remove('open');
  document.getElementById('notif').classList.add('hidden');
  document.querySelectorAll('#nav [data-nav]').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-nav') === (id === 'employee' && arg === S.me.employeeId ? 'profile' : id === 'employee' ? 'employees' : id)); });
  document.getElementById('title').textContent = id === 'employee' ? 'Employee profile' : navLabel(id) || 'Dashboard';
  var el = document.getElementById('page');
  el.innerHTML = '<div class="empty"><span class="spin"></span> Loading…</div>';
  var fn = PAGES[id];
  if (!fn) { el.innerHTML = '<div class="empty">Page not found.</div>'; return; }
  Promise.resolve().then(function () { return fn(el, arg); }).catch(function (e) {
    if (S.page === id) el.innerHTML = '<div class="err-box">' + h(e.message) + '</div>';
  });
  window.scrollTo(0, 0);
}
function reload() { nav(S.page, S.arg); }

/* ------------------------------------------------------------------ notifications */

function refreshNotifs() {
  api('notifications').then(function (list) {
    S.notifs = list;
    var dot = document.getElementById('bellDot');
    var n = list.filter(function (x) { return x.tone !== 'info'; }).length;
    dot.textContent = n > 99 ? '99+' : n; dot.classList.toggle('hidden', !n);
    var counts = {};
    list.forEach(function (x) { if (x.tone !== 'info' && x.tone !== 'ok') counts[x.page] = (counts[x.page] || 0) + 1; });
    document.querySelectorAll('[data-badge]').forEach(function (b) {
      var c = counts[b.getAttribute('data-badge')] || 0; b.textContent = c; b.classList.toggle('hidden', !c);
    });
  }).catch(function () {});
}

function toggleNotif() {
  var box = document.getElementById('notif');
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
  box.innerHTML = '<h4>🔔 Notifications</h4>' + (S.notifs.length ? S.notifs.map(function (n, i) {
    return '<div class="nitem ' + n.tone + '" data-i="' + i + '"><span class="d"></span><span>' + h(n.text) + '</span></div>';
  }).join('') : '<div class="empty">You are all caught up.</div>');
  box.querySelectorAll('[data-i]').forEach(function (d) {
    d.onclick = function () { var n = S.notifs[+d.getAttribute('data-i')]; box.classList.add('hidden'); if (n.page && PAGES[n.page]) nav(n.page); };
  });
  box.classList.remove('hidden');
  refreshNotifs();
}

/* ------------------------------------------------------------------ formatting */

function h(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); }
function nice(d) {
  var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return h(d || '');
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function time12(t) {
  var m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return h(t || '');
  var hh = +m[1]; return (hh % 12 || 12) + ':' + m[2] + ' ' + (hh < 12 ? 'AM' : 'PM');
}
function peso(v) { var n = Math.round((Number(v) || 0) * 100) / 100; return '₱' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money(v) { return peso(v).slice(1); }
function todayIso() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

var CHIP = {
  ok: ['Active', 'Approved', 'Present', 'Completed', 'Processed', 'Released', 'Hired', 'Valid', 'Open', 'Regular', 'Outstanding', 'Very Good'],
  warn: ['Pending Manager', 'Pending HR', 'Pending', 'Late', 'On Leave', 'In Review', 'Draft', 'For Approval', 'Expiring', 'For Renewal', 'Probationary',
    'Upcoming', 'Not yet in', 'Needs Improvement', 'On Hold', 'Incomplete', 'Submitted'],
  bad: ['Absent', 'Rejected', 'Cancelled', 'Expired', 'Resigned', 'Terminated', 'End of Contract', 'Suspended', 'Withdrawn', 'Unsatisfactory', 'Closed'],
  blue: ['Screening', 'Interview', 'Assessment', 'Final Interview', 'Job Offer', 'Applied', 'Good', 'Filled', 'Rest Day', 'Holiday', 'Retired']
};
function chip(s) {
  var base = String(s || '').replace(/\s*\(.*\)$/, '');
  var cls = Object.keys(CHIP).filter(function (k) { return CHIP[k].indexOf(base) >= 0; })[0] || '';
  return s ? '<span class="chip ' + cls + '">' + h(s) + '</span>' : '';
}

/* ------------------------------------------------------------------ UI building blocks */

function opts(list, sel, blank) {
  return (blank !== undefined ? '<option value="">' + h(blank) + '</option>' : '') + (list || []).map(function (o) {
    var v = typeof o === 'object' ? o.v : o, l = typeof o === 'object' ? o.l : o;
    return '<option value="' + h(v) + '"' + (String(v) === String(sel === undefined ? '' : sel) ? ' selected' : '') + '>' + h(l) + '</option>';
  }).join('');
}

/** field('Label', 'name', 'text'|'date'|'select'|'textarea'|'number'|'file'|'time', value, {options, blank, span, attrs}) */
function field(label, name, type, value, o) {
  o = o || {};
  var v = value === undefined || value === null ? '' : value, inner;
  var at = (o.attrs || '') + (o.required ? ' required' : '');
  if (type === 'select') inner = '<select name="' + name + '"' + at + '>' + opts(o.options, v, o.blank) + '</select>';
  else if (type === 'textarea') inner = '<textarea name="' + name + '"' + at + '>' + h(v) + '</textarea>';
  else if (type === 'file') inner = '<input type="file" name="' + name + '"' + at + (o.accept ? ' accept="' + o.accept + '"' : '') + '>';
  else inner = '<input type="' + type + '" name="' + name + '" value="' + h(v) + '"' + at + (type === 'number' ? ' step="any"' : '') + '>';
  return '<div class="' + (o.span || '') + '"><label>' + h(label) + (o.hint ? ' <span class="muted" style="font-weight:400">— ' + h(o.hint) + '</span>' : '') + '</label>' + inner + '</div>';
}

/** Reads every [name] control inside el. Files are returned as File objects. */
function formData(el) {
  var o = {};
  el.querySelectorAll('[name]').forEach(function (i) {
    if (i.type === 'file') o[i.name] = i.files[0] || null;
    else if (i.type === 'checkbox') { if (i.hasAttribute('data-multi')) { (o[i.name] = o[i.name] || []); if (i.checked) o[i.name].push(i.value); } else o[i.name] = i.checked; }
    else o[i.name] = i.value.trim();
  });
  return o;
}

/** File → {name, mime, data(base64)}; images are shrunk to 1280 px JPEG to stay small. */
function readFile(file, maxPx) {
  if (!file) return Promise.resolve(null);
  if (file.size > 10 * 1024 * 1024 && !/^image\//.test(file.type)) return Promise.reject(new Error('Files can be up to 10 MB.'));
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onerror = function () { reject(new Error('Cannot read the file.')); };
    r.onload = function () {
      if (!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) return resolve({ name: file.name, mime: file.type || 'application/octet-stream', data: r.result });
      var img = new Image();
      img.onload = function () {
        var max = maxPx || 1280, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82) });
      };
      img.onerror = function () { resolve({ name: file.name, mime: file.type, data: r.result }); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, err ? 8000 : 5000);
}

/**
 * modal({ title, body, wide, narrow, ok, okClass, cancel, onOk(formEl) → Promise|value })
 * onOk errors show inside the dialog; resolving closes it.
 */
function modal(o) {
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="overlay" role="dialog" aria-modal="true"><div class="modal ' + (o.wide ? 'wide' : o.narrow ? 'narrow' : '') + '">' +
    '<div class="modal-bar"><b>' + h(o.title) + '</b><button class="btn sm" data-x>Close</button></div><div class="mbody">' + (o.body || '') + '</div>' +
    '<div class="err-box hidden" data-err style="margin-top:12px"></div>' +
    (o.onOk ? '<div class="btns end" style="margin-top:14px"><button class="btn" data-x>' + h(o.cancel || 'Cancel') + '</button>' +
      '<button class="btn ' + (o.okClass || 'pri') + '" data-ok>' + h(o.ok || 'Save') + '</button></div>' : '') + '</div></div>';
  var box = root.querySelector('.modal'), body = root.querySelector('.mbody'), err = root.querySelector('[data-err]');
  root.querySelectorAll('[data-x]').forEach(function (b) { b.onclick = closeModal; });
  var okBtn = root.querySelector('[data-ok]');
  if (okBtn) okBtn.onclick = function () {
    okBtn.disabled = true; var label = okBtn.textContent; okBtn.innerHTML = '<span class="spin"></span> ' + h(label);
    err.classList.add('hidden');
    Promise.resolve().then(function () { return o.onOk(body); }).then(function (r) {
      if (r === false) return;
      closeModal();
      if (typeof r === 'string') toast(r);
      else if (r && r.msg) toast(r.msg);
    }).catch(function (e) { err.textContent = e.message; err.classList.remove('hidden'); })
      .then(function () { okBtn.disabled = false; okBtn.textContent = label; });
  };
  return { el: body, box: box, error: function (m) { err.textContent = m; err.classList.remove('hidden'); } };
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

function confirmBox(title, message, okLabel, danger) {
  return new Promise(function (resolve) {
    modal({ title: title, narrow: true, body: '<p style="margin:0">' + message + '</p>', ok: okLabel || 'Confirm', okClass: danger ? 'danger' : 'pri',
            onOk: function () { resolve(true); return true; } });
    document.querySelectorAll('#modalRoot [data-x]').forEach(function (b) { b.addEventListener('click', function () { resolve(false); }); });
  });
}

function promptBox(title, label, required, value) {
  return new Promise(function (resolve) {
    modal({ title: title, narrow: true, body: field(label, 'v', 'textarea', value || ''), ok: 'OK',
            onOk: function (el) { var v = el.querySelector('[name=v]').value.trim(); if (required && !v) throw new Error('This is required.'); resolve(v); return true; } });
    document.querySelectorAll('#modalRoot [data-x]').forEach(function (b) { b.addEventListener('click', function () { resolve(null); }); });
  });
}

/** Runs an api call from a button: shows progress, toasts the message, reloads the page. */
function act(btn, action, payload, after) {
  if (btn) { btn.disabled = true; btn.dataset.l = btn.textContent; btn.innerHTML = '<span class="spin"></span>'; }
  return api(action, payload).then(function (r) {
    toast(typeof r === 'string' ? r : (r && r.msg) || 'Done.');
    refreshNotifs();
    if (after) after(r); else reload();
    return r;
  }).catch(function (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = btn.dataset.l; } });
}

/**
 * table(cols, rows, { empty, onRow(row) }) — cols: [{ k, l, num, f(row) }]
 * Returns HTML; wire clicks with bindRows(el, rows, fn).
 */
function table(cols, rows, o) {
  o = o || {};
  if (!rows.length) return '<div class="tbl"><div class="empty">' + h(o.empty || 'Nothing here yet.') + '</div></div>';
  return '<div class="tbl"><table class="t"><tr>' + cols.map(function (c) { return '<th' + (c.num ? ' class="num"' : '') + '>' + h(c.l) + '</th>'; }).join('') + '</tr>' +
    rows.map(function (r, i) {
      return '<tr' + (o.click ? ' class="go" data-row="' + i + '"' : '') + '>' + cols.map(function (c) {
        return '<td' + (c.num ? ' class="num"' : '') + '>' + (c.f ? c.f(r) : h(r[c.k])) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</table></div>';
}
function bindRows(el, rows, fn) {
  el.querySelectorAll('[data-row]').forEach(function (tr) {
    tr.onclick = function (ev) { if (ev.target.closest('button,a,input,select')) return; fn(rows[+tr.getAttribute('data-row')]); };
  });
}
function on(el, sel, fn) { el.querySelectorAll(sel).forEach(function (b) { b.onclick = function (ev) { fn(b, ev); }; }); }

function seg(items, cur) {
  return '<div class="seg">' + items.map(function (x) {
    return '<button type="button" data-seg="' + h(x.v) + '" class="' + (x.v === cur ? 'on' : '') + '">' + h(x.l) + (x.n ? '<i>' + x.n + '</i>' : '') + '</button>';
  }).join('') + '</div>';
}

function kpi(label, value, sub, cls, page) {
  return '<div class="kpi ' + (cls || '') + (page ? ' link" data-go="' + page : '') + '"><small>' + label + '</small><b>' + h(value) + '</b>' + (sub ? '<i>' + h(sub) + '</i>' : '') + '</div>';
}
function wireGo(el) { on(el, '[data-go]', function (b) { nav(b.getAttribute('data-go')); }); }

/* ------------------------------------------------------------------ charts */

function bars(data, color) {
  if (!data || !data.length) return '<div class="muted">No data yet.</div>';
  var max = Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;
  return '<div class="bars">' + data.map(function (d) {
    return '<div class="bar"><span title="' + h(d.label) + '">' + h(d.label) + '</span><div class="track"><div class="fill" style="width:' +
      Math.max(2, d.value / max * 100) + '%;' + (color ? 'background:' + color : '') + '"></div></div><b>' + d.value + '</b></div>';
  }).join('') + '</div>';
}

function lineChart(data) {
  if (!data || !data.length) return '<div class="muted">No data yet.</div>';
  var W = 560, H = 170, P = 26, max = Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;
  var x = function (i) { return P + i * (W - P * 2) / Math.max(1, data.length - 1); };
  var y = function (v) { return H - P - v / max * (H - P * 2); };
  var pts = data.map(function (d, i) { return x(i).toFixed(1) + ',' + y(d.value).toFixed(1); }).join(' ');
  var area = 'M' + x(0) + ',' + (H - P) + ' L' + pts.split(' ').join(' L') + ' L' + x(data.length - 1) + ',' + (H - P) + ' Z';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="Attendance trend">' +
    '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="#e6e8f0"/>' +
    '<path d="' + area + '" fill="#2b4fd8" opacity=".08"/><polyline points="' + pts + '" fill="none" stroke="#2b4fd8" stroke-width="2.5" stroke-linejoin="round"/>' +
    data.map(function (d, i) {
      return '<circle cx="' + x(i) + '" cy="' + y(d.value) + '" r="3" fill="#2b4fd8"><title>' + h(d.label) + ': ' + d.value + '</title></circle>' +
        (i % 5 === 0 || i === data.length - 1 ? '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="#667085">' + h(d.label) + '</text>' : '');
    }).join('') + '<text x="' + P + '" y="14" font-size="10" fill="#667085">max ' + max + '</text></svg>';
}

/* ------------------------------------------------------------------ files, CSV, print */

function openFile(fileId) {
  if (!fileId) return;
  toast('Opening file…');
  api('fileUrl', { fileId: fileId }).then(function (f) {
    if (/^image\//.test(f.mime)) modal({ title: f.name, body: '<img src="' + f.data + '" alt="" style="width:100%;border-radius:12px">' });
    else {
      var a = document.createElement('a'); a.href = f.data; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    }
  }).catch(function (e) { toast(e.message, true); });
}
function fileLink(id, label) { return id ? '<a href="#" data-file="' + h(id) + '">' + h(label || 'View') + '</a>' : ''; }
function wireFiles(el) { el.querySelectorAll('[data-file]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); openFile(a.getAttribute('data-file')); }; }); }

function downloadCsv(name, cols, rows) {
  var q = function (s) { var v = String(s === null || s === undefined ? '' : s); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var text = [cols].concat(rows).map(function (r) { return r.map(q).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' }));
  a.download = name.replace(/[^\w\- .]+/g, '_') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function printDoc(title, body) {
  var w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups to print.', true); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + h(title) + '</title><style>' +
    'body{font:12px Arial,sans-serif;color:#1b2133;margin:24px}h1{font-size:18px;margin:0}h2{font-size:14px;margin:4px 0 14px;color:#555;font-weight:normal}' +
    'table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #ccd;padding:5px 7px;text-align:left}th{background:#eef0f6}td.num,th.num{text-align:right}' +
    '.head{display:flex;justify-content:space-between;border-bottom:3px solid #c62828;padding-bottom:8px;margin-bottom:12px}.tot td{font-weight:bold}' +
    '</style></head><body>' + body + '<script>setTimeout(function(){window.print()},300)<\/script></body></html>');
  w.document.close();
}

/* ------------------------------------------------------------------ shared data */

function lookups(force) {
  if (S.lookups && !force) return Promise.resolve(S.lookups);
  return api('lookups').then(function (l) { S.lookups = l; return l; });
}
function empOpts(l, sel) { return opts(l.employees.map(function (e) { return { v: e.EmployeeID, l: e.FullName + ' (' + e.EmployeeID + ') — ' + e.Branch }; }), sel, 'Choose employee…'); }
function branchOpts(l, sel, blank) { return opts(l.branches.map(function (b) { return { v: b.Branch, l: b.Branch + (b.Type !== 'Branch' ? ' (' + b.Type + ')' : '') }; }), sel, blank); }
function myBranchList(l) { return isMgr() ? l.branches.filter(function (b) { return S.me.branches.indexOf(b.Branch) >= 0; }) : l.branches; }

/* ------------------------------------------------------------------ password */

function passwordDialog(forced) {
  modal({
    title: forced ? 'Set your own password' : 'Change password', narrow: true, ok: 'Change password',
    body: (forced ? '<div class="info-box" style="margin-bottom:12px">You logged in with a temporary password. Choose your own password to continue.</div>' : '') +
      '<div class="grid2" style="grid-template-columns:1fr">' + field('Current password', 'current', 'password') + field('New password', 'next', 'password', '', { hint: 'at least 8 characters' }) +
      field('Confirm new password', 'confirm', 'password') + '</div>',
    onOk: function (el) {
      return api('changePassword', formData(el)).then(function (m) {
        S.me.mustChange = false;
        if (forced) { nav('dashboard'); refreshNotifs(); }
        return m;
      });
    }
  });
}
</script>
