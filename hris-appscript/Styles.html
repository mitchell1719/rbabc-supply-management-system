<style>
  :root{--navy:#141f52;--navy-2:#1d2a68;--pri:#2b4fd8;--pri-soft:#e8edff;--blue:#1e3a8a;--red:#c62828;--red-dark:#9f1d1d;--ink:#1b2133;--mute:#667085;
    --line:#e6e8f0;--bg:#f4f6fb;--ok:#0f7b4b;--ok-bg:#e3f6ec;--warn:#9a6700;--warn-bg:#fff4d6;--bad:#b42318;--bad-bg:#fde8e7;--info-bg:#e8f1ff;--radius:16px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Lexend,'Segoe UI',Roboto,Arial,sans-serif}
  a{color:var(--pri)} h1,h2,h3,h4{margin:0;font-weight:600} .hidden{display:none!important}
  button,input,select,textarea{font:inherit;color:inherit}
  label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 4px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  textarea{min-height:76px;resize:vertical} input[readonly],input:disabled,select:disabled{background:var(--bg)}
  .grid2,.grid3,.grid4{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .span-all{grid-column:1/-1}.span2{grid-column:span 2}
  @media(max-width:820px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:520px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.span2{grid-column:auto}}
  .btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
  .btn:hover{border-color:#c9cfdf}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:#2141bb}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.outline-red{color:var(--red);border-color:#f2c4c4}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.55;cursor:not-allowed}.btn.block{width:100%}
  .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btns.end{justify-content:flex-end}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card+.card{margin-top:14px}.card h4{margin-bottom:10px}
  .sub{color:var(--mute);font-size:13px}.muted{color:var(--mute)}.right{text-align:right}
  .section{margin-top:22px}.section>h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .tbl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{background:#f8f9fc;color:var(--mute);font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;position:sticky;top:0;font-size:12px}
  table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
  table.t tr:hover td{background:#fafbff}table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
  table.t td small,.small{display:block;color:var(--mute);font-size:11.5px}
  table.t tr.go{cursor:pointer}
  .empty{padding:28px;text-align:center;color:var(--mute)}
  .err-box,.info-box,.warn-box,.ok-box{border-radius:12px;padding:11px 14px;font-size:13px}
  .err-box{background:var(--bad-bg);color:var(--bad)}.info-box{background:var(--info-bg);color:var(--blue)}.warn-box{background:var(--warn-bg);color:var(--warn)}.ok-box{background:var(--ok-bg);color:var(--ok)}
  .chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:600;background:#eef0f6;color:#475069;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.blue{background:var(--pri-soft);color:var(--pri)}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:default}
  .kpi.link{cursor:pointer}.kpi.link:hover{border-color:#c9cfdf}
  .kpi small{color:var(--mute);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}.kpi b{font-size:26px;font-weight:700;line-height:1.2}.kpi i{font-style:normal;font-size:11.5px;color:var(--mute)}
  .kpi.navy{background:var(--navy);border-color:var(--navy);color:#fff}.kpi.navy small,.kpi.navy i{color:rgba(255,255,255,.7)}
  .kpi.green b{color:var(--ok)}.kpi.amber b{color:var(--warn)}.kpi.red b{color:var(--bad)}.kpi.blue b{color:var(--pri)}
  .kpis.small{grid-template-columns:repeat(6,minmax(0,1fr))}.kpis.small .kpi b{font-size:20px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.small{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.tools input,.tools select{width:auto;min-width:150px}
  .tools input[type=search]{min-width:220px;flex:1 1 220px}
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
  .seg button{border:0;background:none;border-radius:9px;padding:7px 13px;cursor:pointer;color:var(--mute);font-weight:500}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}.seg button i{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
  .pagebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay{position:fixed;inset:0;background:rgba(15,20,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:100;overflow:auto}
  .modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:760px;box-shadow:0 30px 60px -20px rgba(16,28,82,.45)}
  .modal.wide{max-width:1100px}.modal.narrow{max-width:460px}
  .modal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.modal-bar b{font-size:17px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:11px 18px;z-index:200;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.err{background:var(--bad)}
  /* layout */
  .app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh;max-width:1560px;margin:0 auto;padding:18px}
  .side{background:var(--navy);color:#fff;border-radius:28px 0 0 28px;padding:22px 40px 18px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:18px;height:calc(100vh - 36px);overflow:hidden}
  .brand{display:flex;align-items:center;gap:12px;font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.15;font-weight:700}
  .brand .logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-family:Lexend,sans-serif;font-weight:800;font-size:13px;flex:none}
  .brand small{display:block;font-family:Lexend,sans-serif;font-size:11px;font-weight:400;opacity:.65;margin-top:3px}
  .views{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:6px -10px 0 -16px;padding:2px 10px 8px 16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
  .views .grp{font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.45);font-weight:700;margin:12px 12px 4px}
  .views a,.sidenav a{display:flex;align-items:center;gap:11px;border-radius:13px;color:rgba(255,255,255,.74);font-size:13.5px;font-weight:500;padding:8px 12px;cursor:pointer;text-decoration:none;position:relative}
  .views a:hover,.sidenav a:hover{background:rgba(255,255,255,.07);color:#fff}
  .views a.on{background:var(--pri);color:#fff;box-shadow:0 10px 20px -10px rgba(43,79,216,.9)}
  .views a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:5px;border-radius:0 5px 5px 0;background:var(--red)}
  .views a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;padding:0 6px;line-height:17px}
  .ico{width:18px;height:18px;flex:none}
  .sidenav{flex:none;border-top:1px solid rgba(255,255,255,.1);padding-top:8px;display:flex;flex-direction:column;gap:1px}
  .acct{flex:none;background:var(--navy-2);border-radius:16px;padding:11px 14px;font-size:12px;color:rgba(255,255,255,.65)}.acct b{color:#fff;font-weight:600;display:block;font-size:13px}
  .main{background:#fff;border-radius:28px;margin-left:-28px;padding:22px 28px 0;min-width:0;position:relative;z-index:1;box-shadow:-18px 0 40px -28px rgba(16,28,82,.35)}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .topbar h1{font-size:22px;flex:1;min-width:0}
  .date{font-size:13px;color:var(--mute)}
  .menu{display:none;border:0;background:var(--bg);border-radius:10px;padding:8px;cursor:pointer}
  .bell{position:relative;border:0;background:var(--pri-soft);color:var(--pri);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .bell .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;line-height:18px;text-align:center;padding:0 4px}
  .prof{display:flex;align-items:center;gap:8px;border:0;background:var(--bg);border-radius:26px;padding:4px 14px 4px 4px;font-size:13px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .notif{position:absolute;right:28px;top:72px;width:380px;max-width:calc(100vw - 30px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 40px -12px rgba(16,28,82,.35);z-index:50;padding:12px}
  .notif h4{margin:4px 6px 8px}.nitem{display:flex;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;font-size:13px}.nitem:hover{background:var(--bg)}
  .nitem .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--pri)}.nitem.warn .d{background:#e3a008}.nitem.bad .d{background:var(--red)}.nitem.ok .d{background:var(--ok)}
  footer{text-align:center;font-size:12px;color:var(--mute);padding:28px 0 22px;margin-top:30px;border-top:1px solid var(--line)}
  @media(max-width:900px){
    .app{display:block;padding:0}
    .side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:270px;height:100vh;border-radius:0;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none}
    .main{margin:0;border-radius:0;padding:14px 14px 0;box-shadow:none}
    .menu{display:inline-flex}.date,.pname{display:none}.notif{right:10px}
  }
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy),#22348a)}
  .login .box{background:#fff;border-radius:24px;padding:30px;width:100%;max-width:400px}
  .login h2{font-family:Fraunces,Georgia,serif;font-size:26px;margin:10px 0 4px}
  /* charts */
  .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  @media(max-width:900px){.charts{grid-template-columns:1fr}}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
  .bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
  .bar .track{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}.bar .fill{height:100%;border-radius:6px;background:var(--pri)}
  .bar b{text-align:right}
  .funnel{display:flex;gap:6px;flex-wrap:wrap}.funnel div{flex:1 1 90px;background:var(--pri-soft);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mute)}
  .funnel div b{display:block;font-size:20px;color:var(--pri)}
  .tree{font-size:13.5px}.tree details{margin:4px 0 4px 14px}.tree summary{cursor:pointer;padding:6px 8px;border-radius:8px;font-weight:600}.tree summary:hover{background:var(--bg)}
  .tree ul{margin:2px 0 6px 18px;padding-left:14px;border-left:2px solid var(--line);list-style:none}.tree li{padding:3px 0}
  .profile-head{display:flex;gap:16px;align-items:center;background:var(--bg);border-radius:20px;padding:18px 20px;margin-bottom:14px}
  .profile-head .avatar{width:64px;height:64px;font-size:20px}
  dl.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;font-weight:500}
  .clock{font-size:42px;font-weight:700;letter-spacing:1px}
  .selfie{width:100%;max-width:320px;border-radius:14px;display:block;margin:8px 0}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
  .checks label{font-weight:400;color:var(--ink);display:flex;gap:6px;align-items:center;margin:0}.checks input{width:auto}
  @media print{body{background:#fff}.no-print{display:none!important}.app{display:block;padding:0}.main{margin:0;padding:0;box-shadow:none}}
</style>
