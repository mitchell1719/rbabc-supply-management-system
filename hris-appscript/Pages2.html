<script>
/* =====================================================================
 * Pages: recruitment, performance, training, documents, employee requests,
 * departments / positions / branches / holidays, organizational structure,
 * reports, HR settings, user management, roles & permissions, audit logs
 * ===================================================================== */

/* ------------------------------------------------------------------ recruitment */

PAGES.recruitment = function (el) {
  var tab = S.recTab || 'pipeline';
  return Promise.all([api('jobsList'), api('applicantsList', {}), lookups()]).then(function (res) {
    var jobs = res[0], apps = res[1], l = res[2];
    var count = function (s) { return apps.filter(function (a) { return a.Stage === s; }).length; };
    var html = '<div class="kpis small">' + kpi('Job vacancies', jobs.filter(function (j) { return j.Status === 'Open'; }).length, '', 'navy') +
      kpi('Applications', apps.length) + kpi('For interview', count('Interview'), '', 'blue') + kpi('For assessment', count('Assessment')) +
      kpi('For final interview', count('Final Interview'), '', 'amber') + kpi('Hired', count('Hired'), '', 'green') + '</div>' +
      '<div class="pagebar" style="margin-top:14px">' + seg([{ v: 'pipeline', l: 'Applicants' }, { v: 'jobs', l: 'Job openings' }], tab) +
      '<div class="btns"><button class="btn" id="newJob">+ Job opening</button><button class="btn pri" id="newApp">+ Applicant</button></div></div><div id="rec"></div>';
    el.innerHTML = html;
    on(el, '[data-seg]', function (b) { S.recTab = b.getAttribute('data-seg'); reload(); });
    el.querySelector('#newJob').onclick = function () { jobForm(null, l); };
    el.querySelector('#newApp').onclick = function () { applicantForm(null, jobs); };
    var box = el.querySelector('#rec');
    if (tab === 'jobs') {
      box.innerHTML = table([{ l: 'Job', f: function (j) { return '<b>' + h(j.Title) + '</b><small>' + h(j.JobID) + ' · posted ' + nice(j.PostedDate) + '</small>'; } },
        { k: 'Position', l: 'Position' }, { l: 'Branch', f: function (j) { return h(j.Branch || '—') + '<small>' + h(j.HQ) + '</small>'; } }, { k: 'Slots', l: 'Slots', num: 1 },
        { k: 'Applicants', l: 'Applicants', num: 1 }, { k: 'Hired', l: 'Hired', num: 1 }, { l: 'Status', f: function (j) { return chip(j.Status); } }], jobs, { click: 1, empty: 'No job openings yet.' });
      bindRows(box, jobs, function (j) { jobForm(j, l); });
      return;
    }
    var stage = S.recStage || '';
    var shown = apps.filter(function (a) { return !stage || a.Stage === stage; });
    box.innerHTML = '<div class="funnel" style="margin-bottom:12px">' + l.stages.map(function (s) {
      return '<div data-st="' + h(s) + '" style="cursor:pointer;' + (s === stage ? 'outline:2px solid var(--pri)' : '') + '"><b>' + count(s) + '</b>' + h(s) + '</div>'; }).join('') + '</div>' +
      table([{ l: 'Applicant', f: function (a) { return '<b>' + h(a.Name) + '</b><small>' + h(a.ApplicantID) + ' · ' + h(a.Email || a.Contact) + '</small>'; } },
        { l: 'Job', f: function (a) { return h(a.JobTitle) + '<small>' + h(a.Source) + '</small>'; } }, { l: 'Applied', f: function (a) { return nice(a.AppliedDate); } },
        { k: 'Score', l: 'Score', num: 1 }, { l: 'Stage', f: function (a) { return chip(a.Stage) + (a.EmployeeID ? '<small>' + h(a.EmployeeID) + '</small>' : ''); } },
        { l: 'Resume', f: function (a) { return fileLink(a.ResumeId, 'resume'); } },
        { l: '', f: function (a) {
          if (['Hired', 'Rejected', 'Withdrawn'].indexOf(a.Stage) >= 0) return '';
          var i = l.stages.indexOf(a.Stage), nx = l.stages[i + 1];
          return '<div class="btns">' + (nx && nx !== 'Hired' ? '<button class="btn sm" data-mv="' + h(a.ApplicantID) + '" data-to="' + h(nx) + '">→ ' + h(nx) + '</button>' : '') +
            (a.Stage === 'Job Offer' || a.Stage === 'Final Interview' ? '<button class="btn sm ok" data-hire="' + h(a.ApplicantID) + '">Hire</button>' : '') +
            '<button class="btn sm outline-red" data-mv="' + h(a.ApplicantID) + '" data-to="Rejected">Reject</button></div>';
        } }], shown, { click: 1, empty: 'No applicants' + (stage ? ' in ' + stage : '') + '.' });
    on(box, '[data-st]', function (b) { S.recStage = S.recStage === b.getAttribute('data-st') ? '' : b.getAttribute('data-st'); reload(); });
    bindRows(box, shown, function (a) { applicantForm(a, jobs); });
    on(box, '[data-mv]', function (b) {
      promptBox('Move to ' + b.getAttribute('data-to'), 'Note (interview result, schedule, …)', b.getAttribute('data-to') === 'Rejected').then(function (note) {
        if (note !== null) act(b, 'applicantStage', { id: b.getAttribute('data-mv'), stage: b.getAttribute('data-to'), note: note });
      });
    });
    on(box, '[data-hire]', function (b) {
      var a = apps.filter(function (x) { return x.ApplicantID === b.getAttribute('data-hire'); })[0];
      var job = jobs.filter(function (j) { return j.JobID === a.JobID; })[0] || {};
      modal({ title: 'Hire ' + a.Name, narrow: true, ok: 'Hire & create profile',
        body: '<div class="grid2" style="grid-template-columns:1fr"><div><label>Branch / office</label><select name="branch">' + branchOpts(l, job.Branch, 'Choose…') + '</select></div>' +
          field('Date hired', 'dateHired', 'date', todayIso()) + field('Basic salary (monthly)', 'salary', 'number', '') +
          '<p class="sub" style="margin:0">Creates a Probationary employee profile; the resume is copied to their documents.</p></div>',
        onOk: function (m) { var x = formData(m); x.id = a.ApplicantID; return api('applicantHire', x).then(function (r) { S.lookups = null; nav('employee', r.id); return r.msg; }); } });
    });
    wireFiles(box);
  });
};

function jobForm(j, l) {
  j = j || { Status: 'Open', Slots: 1 };
  modal({
    title: j.JobID ? 'Edit job opening' : 'New job opening', ok: 'Save',
    body: '<div class="grid2">' + field('Job title', 'Title', 'text', j.Title) +
      field('Position', 'Position', 'select', j.Position, { options: l.positions.map(function (p) { return p.Position; }), blank: '—' }) +
      field('Department', 'Department', 'select', j.Department, { options: l.departments, blank: '—' }) +
      '<div><label>Branch / office</label><select name="Branch">' + branchOpts(l, j.Branch, 'Any / to be decided') + '</select></div>' +
      field('Slots', 'Slots', 'number', j.Slots) + field('Status', 'Status', 'select', j.Status, { options: ['Open', 'On Hold', 'Closed', 'Filled'] }) +
      field('Description / qualifications', 'Description', 'textarea', j.Description, { span: 'span-all' }) + '</div>',
    onOk: function (el) { var x = formData(el); x.JobID = j.JobID; return api('jobSave', { job: x }).then(function (m) { reload(); return m; }); }
  });
}

function applicantForm(a, jobs) {
  a = a || {};
  var open = jobs.filter(function (j) { return j.Status === 'Open' || j.JobID === a.JobID; });
  if (!open.length) return toast('Post a job opening first.', true);
  modal({
    title: a.ApplicantID ? a.Name + ' — ' + a.Stage : 'New applicant', ok: 'Save',
    body: '<div class="grid2">' + field('Job opening', 'JobID', 'select', a.JobID, { options: open.map(function (j) { return { v: j.JobID, l: j.Title + (j.Branch ? ' — ' + j.Branch : '') }; }), blank: 'Choose…' }) +
      field('Full name', 'Name', 'text', a.Name) + field('E-mail', 'Email', 'email', a.Email) + field('Contact', 'Contact', 'text', a.Contact) +
      field('Address', 'Address', 'text', a.Address) + field('Source', 'Source', 'text', a.Source, { hint: 'referral, Facebook, JobStreet, walk-in…' }) +
      field('Score / rating', 'Score', 'text', a.Score) + field('Resume', 'resume', 'file', '', { accept: 'application/pdf,image/*,.doc,.docx' }) +
      field('Notes', 'Notes', 'textarea', a.Notes, { span: 'span-all' }) + '</div>',
    onOk: function (el) {
      var x = formData(el), file = x.resume; delete x.resume; x.ApplicantID = a.ApplicantID;
      return readFile(file).then(function (f) { return api('applicantSave', { applicant: x, resume: f }); }).then(function (m) { reload(); return m; });
    }
  });
}

/* ------------------------------------------------------------------ performance */

function evalTable(rows) {
  return table([{ l: 'Employee', f: function (r) { return '<b>' + h(r.EmployeeName) + '</b><small>' + h(r.Position) + ' · ' + h(r.Branch) + '</small>'; } },
    { k: 'Period', l: 'Period' }, { k: 'Attendance', l: 'Attendance', num: 1 }, { k: 'PatientService', l: 'Patient service', num: 1 },
    { k: 'ClinicalCompliance', l: 'Clinical compliance', num: 1 }, { k: 'Documentation', l: 'Documentation', num: 1 }, { k: 'Teamwork', l: 'Teamwork', num: 1 },
    { l: 'Overall', num: 1, f: function (r) { return '<b>' + h(r.Overall) + '%</b>'; } }, { l: 'Rating', f: function (r) { return chip(r.Rating); } },
    { l: 'Evaluator', f: function (r) { return h(r.Evaluator) + '<small>' + nice(r.Date) + '</small>'; } }], rows, { empty: 'No evaluations yet.', click: isHR() || isMgr() });
}

PAGES.performance = function (el) {
  return api('evaluationsList', {}).then(function (rows) {
    var can = isHR() || isMgr();
    el.innerHTML = '<div class="pagebar"><p class="sub" style="margin:0">Rating: 90–100 Outstanding · 80–89 Very Good · 70–79 Good · 60–69 Needs Improvement · below 60 Unsatisfactory</p>' +
      (can ? '<button class="btn pri" id="new">+ New evaluation</button>' : '') + '</div>' + evalTable(rows);
    if (can) { el.querySelector('#new').onclick = function () { evalForm(null); }; bindRows(el, rows, evalForm); }
  });
};

function evalForm(ev) {
  ev = ev || {};
  lookups().then(function (l) {
    var emps = l.employees.filter(function (e) { return e.EmployeeID !== S.me.employeeId; });
    modal({
      title: ev.EvalID ? 'Evaluation — ' + ev.EmployeeName : 'New performance evaluation', ok: 'Save evaluation',
      body: '<div class="grid2">' + (ev.EvalID ? '<input type="hidden" name="EmployeeID" value="' + h(ev.EmployeeID) + '"><div><label>Employee</label><input value="' + h(ev.EmployeeName) + '" readonly></div>'
        : '<div><label>Employee</label><select name="EmployeeID">' + empOpts({ employees: emps }) + '</select></div>') +
        field('Period', 'Period', 'text', ev.Period, { hint: 'e.g. Jan–Jun 2026' }) + '</div><div class="grid3" style="margin-top:12px">' +
        l.criteria.map(function (c) { return field(c.label + ' (0–100)', c.key, 'number', ev[c.key]); }).join('') +
        '<div><label>Overall</label><input id="ovr" readonly></div></div>' + field('Remarks / development plan', 'Remarks', 'textarea', ev.Remarks),
      onOk: function (el) { var x = formData(el); x.EvalID = ev.EvalID; return api('evaluationSave', { evaluation: x }).then(function (m) { reload(); return m; }); }
    });
    var box = document.querySelector('#modalRoot .mbody');
    var calc = function () {
      var v = l.criteria.map(function (c) { return Number(box.querySelector('[name=' + c.key + ']').value) || 0; });
      var o = Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length * 100) / 100;
      box.querySelector('#ovr').value = o + '% — ' + (o >= 90 ? 'Outstanding' : o >= 80 ? 'Very Good' : o >= 70 ? 'Good' : o >= 60 ? 'Needs Improvement' : 'Unsatisfactory');
    };
    box.querySelectorAll('input[type=number]').forEach(function (i) { i.oninput = calc; }); calc();
  });
}

/* ------------------------------------------------------------------ training */

PAGES.training = function (el) {
  return api('trainingsList', {}).then(function (rows) {
    var c = function (s) { return rows.filter(function (r) { return r.State === s; }).length; };
    var st = S.trState || '';
    var shown = rows.filter(function (r) { return !st || r.State === st; });
    el.innerHTML = '<div class="kpis">' + kpi('Completed', c('Completed'), '', 'green') + kpi('Upcoming', c('Upcoming'), '', 'blue') +
      kpi('Expired', c('Expired'), '', 'red') + kpi('For renewal', c('For Renewal'), '', 'amber') + '</div>' +
      '<div class="pagebar" style="margin-top:14px">' + seg([{ v: '', l: 'All' }, { v: 'Upcoming', l: 'Upcoming' }, { v: 'For Renewal', l: 'For renewal' }, { v: 'Expired', l: 'Expired' }, { v: 'Completed', l: 'Completed' }], st) +
      (isHR() ? '<button class="btn pri" id="new">+ Record training</button>' : '') + '</div>' +
      table([{ l: 'Training', f: function (r) { return '<b>' + h(r.Title) + '</b><small>' + h(r.Trainer) + (r.Location ? ' · ' + h(r.Location) : '') + '</small>'; } },
        { l: 'Employee', f: function (r) { return h(r.EmployeeName) + '<small>' + h(r.EmployeeID) + ' · ' + h(r.Branch) + '</small>'; } },
        { l: 'Date', f: function (r) { return nice(r.Date); } }, { l: 'Certificate', f: function (r) { return fileLink(r.CertificateId, 'certificate') || '—'; } },
        { l: 'Expiry', f: function (r) { return nice(r.ExpiryDate) || '—'; } }, { l: 'Status', f: function (r) { return chip(r.State); } }], shown, { click: isHR(), empty: 'No trainings.' });
    on(el, '[data-seg]', function (b) { S.trState = b.getAttribute('data-seg'); reload(); });
    if (isHR()) { el.querySelector('#new').onclick = function () { trainingForm(null); }; bindRows(el, shown, trainingForm); }
    wireFiles(el);
  });
};

function trainingForm(t) {
  t = t || { Status: 'Completed', Date: todayIso() };
  lookups().then(function (l) {
    modal({
      title: t.TrainingID ? 'Edit training' : 'Record training', ok: 'Save',
      body: '<div class="grid2">' + field('Training title', 'Title', 'text', t.Title, { span: 'span-all', hint: 'e.g. Rabies Exposure Management Training' }) +
        (t.TrainingID ? '<input type="hidden" name="EmployeeID" value="' + h(t.EmployeeID) + '"><div class="span-all"><label>Employee</label><input value="' + h(t.EmployeeName) + '" readonly></div>'
          : '<div class="span-all"><label>Employees (one or more)</label><div class="checks">' + l.employees.map(function (e) {
            return '<label><input type="checkbox" name="EmployeeIDs" data-multi value="' + h(e.EmployeeID) + '"> ' + h(e.FullName) + ' <span class="muted">· ' + h(e.Branch) + '</span></label>'; }).join('') + '</div></div>') +
        field('Date', 'Date', 'date', t.Date) + field('Status', 'Status', 'select', t.Status, { options: ['Completed', 'Upcoming', 'Cancelled'] }) +
        field('Trainer', 'Trainer', 'text', t.Trainer) + field('Location', 'Location', 'text', t.Location) +
        field('Certificate expiry', 'ExpiryDate', 'date', t.ExpiryDate) + field('Certificate file', 'certificate', 'file', '', { accept: 'application/pdf,image/*' }) +
        field('Remarks', 'Remarks', 'textarea', t.Remarks, { span: 'span-all' }) + '</div>',
      onOk: function (el) {
        var x = formData(el), file = x.certificate; delete x.certificate; x.TrainingID = t.TrainingID;
        return readFile(file).then(function (f) { return api('trainingSave', { training: x, certificate: f }); }).then(function (m) { reload(); return m; });
      }
    });
  });
}

/* ------------------------------------------------------------------ documents */

function docTable(rows, canDelete) {
  return table([{ l: 'Document', f: function (d) { return '<b>' + h(d.DocType) + '</b><small>' + fileLink(d.FileId, d.FileName) + '</small>'; } },
    { l: 'Employee', f: function (d) { return h(d.EmployeeName) + '<small>' + h(d.EmployeeID) + '</small>'; } },
    { l: 'Issued', f: function (d) { return nice(d.IssueDate) || '—'; } },
    { l: 'Expiry', f: function (d) { return (nice(d.ExpiryDate) || '—') + (d.DaysLeft !== '' && d.DaysLeft !== undefined ? '<small>' + (d.DaysLeft < 0 ? 'expired ' + (-d.DaysLeft) + ' day(s) ago' : d.DaysLeft + ' day(s) left') + '</small>' : ''); } },
    { l: 'Status', f: function (d) { return chip(d.State || 'Valid'); } },
    { l: 'Uploaded', f: function (d) { return h(d.UploadedBy) + '<small>' + nice(d.UploadedAt) + '</small>'; } },
    { l: '', f: function (d) { return canDelete ? '<button class="btn sm outline-red" data-del="' + h(d.DocID) + '">Delete</button>' : ''; } }], rows, { empty: 'No documents yet.' });
}
function wireDocDelete(el) {
  on(el, '[data-del]', function (b) {
    confirmBox('Delete document', 'Delete this document? The file goes to the Drive trash.', 'Delete', true).then(function (ok) { if (ok) act(b, 'documentDelete', { id: b.getAttribute('data-del') }); });
  });
}

PAGES.documents = function (el) {
  var f = S.docF || (S.docF = { expiring: false, type: '' });
  return Promise.all([api('documentsList', { expiring: f.expiring, type: f.type }), lookups()]).then(function (res) {
    var rows = res[0], l = res[1];
    el.innerHTML = '<div class="tools">' + seg([{ v: 'all', l: 'All documents' }, { v: 'exp', l: '⚠ Expiring / expired' }], f.expiring ? 'exp' : 'all') +
      '<select id="ty">' + opts(l.docTypes, f.type, 'All types') + '</select>' +
      ((isHR() || hasEmp()) ? '<button class="btn pri" id="up">+ Upload</button>' : '') + '</div>' +
      rows.filter(function (d) { return d.State !== 'Valid'; }).slice(0, 6).map(function (d) {
        return '<div class="' + (d.State === 'Expired' ? 'err-box' : 'warn-box') + '" style="margin-bottom:6px">⚠ ' + h(d.DocType) + ' of ' + h(d.EmployeeName) +
          (d.State === 'Expired' ? ' expired on ' + nice(d.ExpiryDate) : ' expires in ' + d.DaysLeft + ' day(s)') + '</div>';
      }).join('') + docTable(rows, isHR());
    on(el, '[data-seg]', function (b) { f.expiring = b.getAttribute('data-seg') === 'exp'; reload(); });
    el.querySelector('#ty').onchange = function () { f.type = this.value; reload(); };
    var up = el.querySelector('#up'); if (up) up.onclick = function () { uploadForm(isHR() ? '' : S.me.employeeId); };
    wireFiles(el); wireDocDelete(el);
  });
};

function uploadForm(empId) {
  lookups().then(function (l) {
    modal({
      title: 'Upload document', ok: 'Upload',
      body: '<div class="grid2">' + (isHR() ? '<div class="span-all"><label>Employee</label><select name="employeeId">' + empOpts(l, empId) + '</select></div>'
        : '<input type="hidden" name="employeeId" value="' + h(empId) + '">') +
        field('Document type', 'docType', 'select', '', { options: l.docTypes, blank: 'Choose…' }) + field('File', 'file', 'file', '', { accept: 'application/pdf,image/*,.doc,.docx' }) +
        field('Issue date', 'issueDate', 'date', '') + field('Expiry date', 'expiryDate', 'date', '', { hint: 'licenses, certificates, IDs' }) +
        field('Remarks', 'remarks', 'text', '', { span: 'span-all' }) + '</div>',
      onOk: function (el) {
        var x = formData(el);
        return readFile(x.file, 2000).then(function (f) { x.file = f; return api('documentUpload', x); }).then(function (m) { reload(); return m; });
      }
    });
  });
}

/* ------------------------------------------------------------------ employee requests */

PAGES.requests = function (el) {
  var st = S.reqSt !== undefined ? S.reqSt : (isHR() ? 'open' : '');
  return Promise.all([api('requestsList', { status: st }), lookups()]).then(function (res) {
    var rows = res[0], l = res[1];
    el.innerHTML = '<div class="pagebar">' + seg([{ v: 'open', l: 'Open' }, { v: 'Completed', l: 'Completed' }, { v: 'Rejected', l: 'Rejected' }, { v: '', l: 'All' }], st) +
      (hasEmp() || isHR() ? '<button class="btn pri" id="new">+ New request</button>' : '') + '</div>' +
      '<p class="sub">Employee → Request → HR review → Approve → Completed. For leave, overtime and attendance corrections use their own pages.</p>' +
      table([{ l: 'Request', f: function (r) { return '<b>' + h(r.Type) + '</b><small>' + h(r.RequestID) + ' · ' + nice(r.CreatedAt) + '</small>'; } },
        { l: 'Employee', f: function (r) { return h(r.EmployeeName) + '<small>' + h(r.Branch) + '</small>'; } },
        { l: 'Details', f: function (r) { return h(r.Details) + (r.AttachmentId ? '<small>' + fileLink(r.AttachmentId, 'attachment') + '</small>' : ''); } },
        { l: 'Status', f: function (r) { return chip(r.Status) + (r.HRNote ? '<small>' + h(r.HRBy) + ': ' + h(r.HRNote) + '</small>' : ''); } },
        { l: '', f: function (r) {
          if (!isHR() || ['Completed', 'Rejected'].indexOf(r.Status) >= 0) return '';
          var next = { Submitted: 'In Review', 'In Review': 'Approved', Approved: 'Completed' }[r.Status];
          return '<div class="btns"><button class="btn sm ok" data-rq="' + h(r.RequestID) + '" data-to="' + next + '">' + (next === 'In Review' ? 'Start review' : next === 'Approved' ? 'Approve' : 'Mark completed') + '</button>' +
            '<button class="btn sm outline-red" data-rq="' + h(r.RequestID) + '" data-to="Rejected">Reject</button></div>';
        } }], rows, { empty: 'No requests.' });
    on(el, '[data-seg]', function (b) { S.reqSt = b.getAttribute('data-seg'); reload(); });
    var n = el.querySelector('#new'); if (n) n.onclick = function () { requestForm(l); };
    on(el, '[data-rq]', function (b) {
      var to = b.getAttribute('data-to');
      promptBox(to, to === 'Rejected' ? 'Reason' : 'Note to the employee (optional)', to === 'Rejected').then(function (note) {
        if (note !== null) act(b, 'requestAction', { id: b.getAttribute('data-rq'), status: to, note: note });
      });
    });
    wireFiles(el);
  });
};

function requestForm(l) {
  modal({
    title: 'New HR request', ok: 'Submit request',
    body: '<div class="grid2">' + (isHR() ? '<div class="span-all"><label>Employee</label><select name="employeeId">' + empOpts(l, S.me.employeeId) + '</select></div>' : '') +
      field('Request type', 'type', 'select', '', { options: l.requestTypes, blank: 'Choose…', span: 'span-all' }) +
      field('Details', 'details', 'textarea', '', { span: 'span-all', hint: 'purpose, addressee, number of copies, new schedule…' }) +
      field('Attachment (optional)', 'attachment', 'file', '', { span: 'span-all' }) + '</div>',
    onOk: function (el) {
      var x = formData(el);
      return readFile(x.attachment).then(function (f) { x.attachment = f; return api('requestSubmit', x); }).then(function (m) { reload(); return m; });
    }
  });
}

/* ------------------------------------------------------------------ organization lists */

var ORG_COLS = {
  departments: { key: 'Department', cols: [['Department', 'text'], ['Head', 'text'], ['Description', 'textarea'], ['Active', 'bool']] },
  positions: { key: 'Position', cols: [['Position', 'text'], ['Department', 'dept'], ['Level', 'select', ['Staff', 'Supervisory', 'Managerial', 'Executive']], ['Description', 'textarea'], ['Active', 'bool']] },
  branches: { key: 'Branch', cols: [['Branch', 'text'], ['Code', 'text'], ['Type', 'select', ['Branch', 'HQ Office', 'Central Office']], ['HQ', 'hq'], ['Address', 'text'],
    ['Lat', 'text'], ['Lng', 'text'], ['Radius', 'number'], ['Manager', 'text'], ['Active', 'bool']] },
  holidays: { key: 'Date', cols: [['Date', 'date'], ['Name', 'text'], ['Type', 'select', ['Regular', 'Special']]] }
};

function orgPage(kind) {
  return function (el) {
    return api('orgGet').then(function (d) {
      var cfg = ORG_COLS[kind], rows = d[kind];
      var q = (S['q_' + kind] || '').toLowerCase();
      var shown = rows.filter(function (r) { return !q || JSON.stringify(r).toLowerCase().indexOf(q) >= 0; });
      var cols = cfg.cols.filter(function (c) { return c[1] !== 'textarea' && c[0] !== 'Lat' && c[0] !== 'Lng'; }).map(function (c) {
        return { l: c[0], f: function (r) { return c[1] === 'bool' ? chip(r[c[0]] === 'FALSE' ? 'Inactive' : 'Active') : c[1] === 'date' ? nice(r[c[0]]) : h(r[c[0]]); } };
      });
      if (kind === 'branches') cols.splice(4, 0, { l: 'GPS', f: function (r) { return r.Lat && r.Lng ? '✓ ' + h(r.Radius || 150) + ' m' : '<span class="muted">not set</span>'; } });
      if (kind !== 'holidays') cols.push({ k: 'Employees', l: 'Employees', num: 1 });
      el.innerHTML = '<div class="tools"><input type="search" id="q" placeholder="Search" value="' + h(S['q_' + kind] || '') + '">' +
        (d.canEdit ? '<button class="btn pri" id="add">+ Add</button>' : '') + '</div>' +
        (kind === 'branches' ? '<p class="sub">Set each branch\'s GPS point (open the form on a phone inside the branch and use "Use my current location") so selfie attendance can check the radius.</p>' : '') +
        table(cols, shown, { click: d.canEdit });
      var qi = el.querySelector('#q');
      qi.oninput = function () { S['q_' + kind] = qi.value; clearTimeout(qi._t); qi._t = setTimeout(function () { reload(); setTimeout(function () { var x = document.getElementById('q'); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }, 400); }, 400); };
      if (d.canEdit) { el.querySelector('#add').onclick = function () { orgForm(kind, null, d); }; bindRows(el, shown, function (r) { orgForm(kind, r, d); }); }
    });
  };
}
PAGES.departments = orgPage('departments');
PAGES.positions = orgPage('positions');
PAGES.branches = orgPage('branches');
PAGES.holidays = orgPage('holidays');

function orgForm(kind, r, d) {
  var cfg = ORG_COLS[kind], isNew = !r;
  r = r || { Active: 'TRUE', Radius: 150 };
  modal({
    title: (isNew ? 'Add ' : 'Edit ') + cfg.key.toLowerCase(), ok: 'Save',
    body: '<div class="grid2">' + cfg.cols.map(function (c) {
      var k = c[0], t = c[1], v = r[k];
      if (t === 'bool') return field(k, k, 'select', v === 'FALSE' ? 'FALSE' : 'TRUE', { options: [{ v: 'TRUE', l: 'Active' }, { v: 'FALSE', l: 'Inactive' }] });
      if (t === 'dept') return field(k, k, 'select', v, { options: d.departments.map(function (x) { return x.Department; }), blank: '—' });
      if (t === 'hq') return field(k, k, 'select', v, { options: d.hqs.map(function (x) { return { v: x.HQ, l: x.Name }; }), blank: 'Choose…' });
      if (t === 'select') return field(k, k, 'select', v, { options: c[2] });
      return field(k, k, t, v, { span: t === 'textarea' ? 'span-all' : '' });
    }).join('') + '</div>' +
      (kind === 'branches' ? '<button type="button" class="btn sm" id="here" style="margin-top:8px">Use my current location</button>' : '') +
      (!isNew ? '<div style="margin-top:14px"><button type="button" class="btn sm outline-red" id="del">Delete</button></div>' : ''),
    onOk: function (el) { return api('orgSave', { kind: kind, original: isNew ? '' : r[cfg.key], row: formData(el) }).then(function (m) { S.lookups = null; reload(); return m; }); }
  });
  var box = document.querySelector('#modalRoot .mbody');
  var here = box.querySelector('#here');
  if (here) here.onclick = function () {
    navigator.geolocation.getCurrentPosition(function (p) {
      box.querySelector('[name=Lat]').value = p.coords.latitude.toFixed(6); box.querySelector('[name=Lng]').value = p.coords.longitude.toFixed(6);
      toast('Location filled (±' + Math.round(p.coords.accuracy) + ' m). Save to keep it.');
    }, function () { toast('Cannot get your location.', true); }, { enableHighAccuracy: true, timeout: 30000 });
  };
  var del = box.querySelector('#del');
  if (del) del.onclick = function () {
    confirmBox('Delete', 'Delete <b>' + h(r[cfg.key]) + '</b>?', 'Delete', true).then(function (ok) {
      if (ok) api('orgDelete', { kind: kind, key: r[cfg.key] }).then(function (m) { toast(m); S.lookups = null; reload(); }).catch(function (e) { toast(e.message, true); });
    });
  };
}

PAGES.org = function (el) {
  return Promise.all([api('orgGet'), api('employeesList', { status: 'active' })]).then(function (res) {
    var d = res[0], emps = res[1];
    var byBranch = {};
    emps.forEach(function (e) { (byBranch[e.Branch] = byBranch[e.Branch] || []).push(e); });
    var html = '<div class="card tree"><b style="font-size:15px">' + h(S.me.company) + '</b> <span class="muted">· ' + emps.length + ' active employee(s)</span>';
    d.hqs.forEach(function (hq) {
      var brs = d.branches.filter(function (b) { return b.HQ === hq.HQ && b.Active !== 'FALSE'; });
      var n = brs.reduce(function (a, b) { return a + (byBranch[b.Branch] || []).length; }, 0);
      html += '<details' + (d.hqs.length <= 5 ? ' open' : '') + '><summary>' + h(hq.Name) + ' <span class="muted" style="font-weight:400">· ' + h(hq.Region) +
        (hq.Head ? ' · head: ' + h(hq.Head) : '') + ' · ' + brs.length + ' unit(s) · ' + n + ' employee(s)</span></summary><ul>' +
        brs.map(function (b) {
          var list = byBranch[b.Branch] || [];
          return '<li><details><summary style="font-weight:500">' + h(b.Branch) + ' <span class="muted" style="font-weight:400">' + (b.Type !== 'Branch' ? '(' + h(b.Type) + ') ' : '') +
            '· ' + list.length + (b.Manager ? ' · mgr: ' + h(b.Manager) : '') + '</span></summary><ul>' +
            (list.length ? list.map(function (e) { return '<li><a href="#" data-emp="' + h(e.EmployeeID) + '">' + h(e.FullName) + '</a> <span class="muted">— ' + h(e.Position) + '</span></li>'; }).join('')
              : '<li class="muted">No employees yet</li>') + '</ul></details></li>';
        }).join('') + '</ul></details>';
    });
    html += '</div><div class="section charts"><div class="card"><h4>Employees by department</h4>' + bars(d.departments.filter(function (x) { return x.Employees; })
      .map(function (x) { return { label: x.Department, value: x.Employees }; })) + '</div><div class="card"><h4>Employees by position</h4>' +
      bars(d.positions.filter(function (x) { return x.Employees; }).map(function (x) { return { label: x.Position, value: x.Employees }; }), '#1e3a8a') + '</div></div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-emp]').forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); nav('employee', a.getAttribute('data-emp')); }; });
  });
};

/* ------------------------------------------------------------------ reports */

function printReport(r) {
  printDoc(r.title, '<div class="head"><div><h1>' + h(S.me.company) + '</h1><h2>' + h(r.title) + (r.subtitle ? ' — ' + h(r.subtitle) : '') + '</h2></div><div style="text-align:right">Generated ' +
    h(r.generated) + '<br>by ' + h(r.by) + '</div></div><table><tr>' + r.columns.map(function (c) { return '<th>' + h(c) + '</th>'; }).join('') + '</tr>' +
    r.rows.map(function (x) { return '<tr>' + x.map(function (v) { return '<td' + (typeof v === 'number' || /^-?\d+(\.\d+)?$/.test(String(v)) ? ' class="num"' : '') + '>' + h(v) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</table><p>' + r.rows.length + ' row(s)</p>');
}

PAGES.reports = function (el) {
  return Promise.all([api('report', { list: true }), isHR() ? api('payrollPeriods') : Promise.resolve([])]).then(function (res) {
    var list = res[0], periods = res[1], groups = {};
    list.forEach(function (r) { (groups[r.group] = groups[r.group] || []).push(r); });
    el.innerHTML = '<div class="charts">' + Object.keys(groups).map(function (g) {
      return '<div class="card"><h4>' + h(g) + ' reports</h4>' + groups[g].map(function (r) {
        return '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)"><span>' + h(r.title) + '</span>' +
          '<button class="btn sm" data-rep="' + r.id + '">Open</button></div>';
      }).join('') + '</div>';
    }).join('') + '</div><div id="out" class="section"></div>';
    on(el, '[data-rep]', function (b) {
      var r = list.filter(function (x) { return x.id === b.getAttribute('data-rep'); })[0];
      var t = todayIso();
      var p = '<div class="grid2">' +
        (r.range ? field('From', 'from', 'date', t.slice(0, 8) + '01') + field('To', 'to', 'date', t) : '') +
        (r.date ? field('Date', 'date', 'date', t) : '') + (r.month ? field('Month', 'month', 'month', t.slice(0, 7)) : '') +
        (r.year ? field('Year', 'year', 'number', t.slice(0, 4)) : '') +
        (r.period ? field('Payroll period', 'periodId', 'select', periods[0] && periods[0].PeriodID, { options: periods.map(function (x) { return { v: x.PeriodID, l: x.Label + ' (' + x.Status + ')' }; }) }) : '') +
        '</div>';
      var run = function (o, how) {
        return api('report', Object.assign({ type: r.id, toSheet: how === 'sheet' }, o)).then(function (rep) {
          if (how === 'csv') downloadCsv(rep.title + (rep.subtitle ? ' ' + rep.subtitle : ''), rep.columns, rep.rows);
          else if (how === 'print') printReport(rep);
          else if (how === 'sheet') { window.open(rep.url, '_blank'); return 'Saved to Google Sheets (HRIS Files/Reports).'; }
          else showReport(el.querySelector('#out'), rep);
          return true;
        });
      };
      var hasParams = r.range || r.date || r.month || r.year || r.period;
      var m = modal({ title: r.title, narrow: true, ok: 'View', body: (hasParams ? p : '<p class="sub">No options needed.</p>') +
        '<div class="btns" style="margin-top:12px"><button type="button" class="btn" data-how="csv">Download CSV</button><button type="button" class="btn" data-how="print">Print</button>' +
        '<button type="button" class="btn" data-how="sheet">Save as Google Sheet</button></div>',
        onOk: function (box) { return run(formData(box), 'view'); } });
      on(m.el, '[data-how]', function (x) {
        x.disabled = true;
        run(formData(m.el), x.getAttribute('data-how')).then(function (msg) { closeModal(); if (typeof msg === 'string') toast(msg); })
          .catch(function (e) { m.error(e.message); x.disabled = false; });
      });
    });
  });
};

function showReport(box, rep) {
  box.innerHTML = '<div class="pagebar"><h3>' + h(rep.title) + (rep.subtitle ? ' <span class="muted" style="font-weight:400">— ' + h(rep.subtitle) + '</span>' : '') + '</h3>' +
    '<div class="btns"><button class="btn" id="rc">CSV</button><button class="btn" id="rp">Print</button></div></div>' +
    '<div class="tbl"><table class="t"><tr>' + rep.columns.map(function (c) { return '<th>' + h(c) + '</th>'; }).join('') + '</tr>' +
    (rep.rows.length ? rep.rows.map(function (x) { return '<tr>' + x.map(function (v) { return '<td>' + h(v) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td colspan="' + rep.columns.length + '" class="empty">No rows.</td></tr>') + '</table></div><p class="sub">' + rep.rows.length + ' row(s)</p>';
  box.querySelector('#rc').onclick = function () { downloadCsv(rep.title + (rep.subtitle ? ' ' + rep.subtitle : ''), rep.columns, rep.rows); };
  box.querySelector('#rp').onclick = function () { printReport(rep); };
  box.scrollIntoView({ behavior: 'smooth' });
}

PAGES.settings = function (el) {
  return api('settingsGet').then(function (rows) {
    el.innerHTML = '<p class="sub">HR settings for the whole HRIS. JSON values (shift, leave credits, payroll rates) must stay valid JSON. ' +
      'Have Accounting confirm the <b>payroll</b> rates (SSS, PhilHealth, Pag-IBIG, BIR table) before the first payroll.</p>' +
      '<div class="card"><div class="grid2">' + rows.map(function (s) {
        var big = /^[\[{]/.test(s.Value);
        var val = big ? JSON.stringify(JSON.parse(s.Value), null, 2) : s.Value;
        return '<div class="' + (big ? 'span-all' : '') + '"><label>' + h(s.Key) + ' <span class="muted" style="font-weight:400">— ' + h(s.Note) + '</span></label>' +
          (big ? '<textarea data-key="' + h(s.Key) + '" rows="' + Math.min(18, val.split('\n').length + 1) + '" style="font-family:monospace;font-size:12px">' + h(val) + '</textarea>'
            : '<input data-key="' + h(s.Key) + '" value="' + h(val) + '">') + '</div>';
      }).join('') + '</div><div class="btns end" style="margin-top:14px"><button class="btn pri" id="save">Save settings</button></div></div>';
    el.querySelector('#save').onclick = function () {
      var out = [];
      el.querySelectorAll('[data-key]').forEach(function (i) {
        var v = i.value.trim();
        if (/^[\[{]/.test(v)) { try { v = JSON.stringify(JSON.parse(v)); } catch (e) { /* server reports it */ } }
        out.push({ Key: i.getAttribute('data-key'), Value: v });
      });
      act(this, 'settingsSave', { settings: out });
    };
  });
};

PAGES.users = function (el) {
  return Promise.all([api('usersList'), api('roles'), lookups()]).then(function (res) {
    var users = res[0], roles = res[1].roles, l = res[2];
    el.innerHTML = '<div class="pagebar"><p class="sub" style="margin:0">Accounts log in with username + password. New accounts get a temporary password they must change at first login.</p>' +
      '<button class="btn pri" id="new">+ New account</button></div>' +
      table([{ l: 'Username', f: function (u) { return '<b>' + h(u.Username) + '</b><small>' + h(u.Email) + '</small>'; } }, { k: 'Name', l: 'Name' },
        { l: 'Role', f: function (u) { return chip(u.RoleLabel); } }, { l: 'Employee', f: function (u) { return h(u.EmployeeID || '—'); } },
        { l: 'Branches', f: function (u) { return '<small>' + h(u.Branches || '—') + '</small>'; } },
        { l: 'Status', f: function (u) { return chip(u.Active === 'TRUE' ? 'Active' : 'Inactive') + (u.MustChange === 'TRUE' ? '<small>temporary password</small>' : ''); } },
        { l: 'Last login', f: function (u) { return '<small>' + h(u.LastLogin || 'never') + '</small>'; } },
        { l: '', f: function (u) { return '<button class="btn sm" data-pw="' + h(u.Username) + '">Reset password</button>'; } }], users, { click: 1 });
    el.querySelector('#new').onclick = function () { userForm(null, roles, l); };
    bindRows(el, users, function (u) { userForm(u, roles, l); });
    on(el, '[data-pw]', function (b) {
      var pw = 'Rb' + Math.random().toString(36).slice(2, 8) + '!' + Math.floor(Math.random() * 90 + 10);
      modal({ title: 'Reset password — ' + b.getAttribute('data-pw'), narrow: true, ok: 'Reset',
        body: field('Temporary password', 'password', 'text', pw, { hint: 'give it to the user; they change it at login' }),
        onOk: function (m) { return api('userResetPassword', { username: b.getAttribute('data-pw'), password: formData(m).password }); } });
    });
  });
};

function userForm(u, roles, l) {
  var isNew = !u;
  u = u || { Role: 'EMPLOYEE', Active: 'TRUE' };
  var sel = String(u.Branches || '').split(',').map(function (s) { return s.trim(); });
  var allEmps = l.employees;
  modal({
    title: isNew ? 'New account' : 'Edit ' + u.Username, ok: 'Save account',
    body: '<div class="grid2">' + field('Username', 'Username', 'text', u.Username, { attrs: isNew ? '' : ' readonly' }) + field('Name', 'Name', 'text', u.Name) +
      field('E-mail (notifications)', 'Email', 'email', u.Email) + field('Role', 'Role', 'select', u.Role, { options: roles.map(function (r) { return { v: r.id, l: r.label }; }) }) +
      '<div class="span-all"><label>Linked employee record <span class="muted" style="font-weight:400">— required for Employee; lets others file their own leave / OT and time in</span></label><select name="EmployeeID">' +
        opts(allEmps.map(function (e) { return { v: e.EmployeeID, l: e.FullName + ' (' + e.EmployeeID + ') — ' + e.Branch }; }), u.EmployeeID, '— none —') + '</select></div>' +
      '<div class="span-all" id="brWrap"><label>Branches covered (Branch Manager)</label><div class="checks">' + l.branches.map(function (b) {
        return '<label><input type="checkbox" name="Branches" data-multi value="' + h(b.Branch) + '"' + (sel.indexOf(b.Branch) >= 0 ? ' checked' : '') + '> ' + h(b.Branch) + '</label>'; }).join('') + '</div></div>' +
      (isNew ? field('Temporary password', 'password', 'text', 'Rb' + Math.random().toString(36).slice(2, 8) + '!' + Math.floor(Math.random() * 90 + 10)) :
        field('Status', 'Active', 'select', u.Active, { options: [{ v: 'TRUE', l: 'Active' }, { v: 'FALSE', l: 'Inactive (cannot log in)' }] })) + '</div>',
    onOk: function (el) {
      var x = formData(el), pw = x.password; delete x.password;
      x.Branches = (x.Branches || []).join(', ');
      if (isNew) x.Active = 'TRUE';
      return api('userSave', { user: x, isNew: isNew, password: pw }).then(function (m) { reload(); return m; });
    }
  });
  var box = document.querySelector('#modalRoot .mbody'), roleSel = box.querySelector('[name=Role]');
  var sync = function () { box.querySelector('#brWrap').classList.toggle('hidden', roleSel.value !== 'BRANCH_MANAGER'); };
  roleSel.onchange = sync; sync();
}

PAGES.audit = function (el) {

      '<button class="btn" id="csv">CSV</button></div><p class="sub">Latest ' + rows.length + ' entries (newest first).</p>' +
